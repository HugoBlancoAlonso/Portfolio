services:
  streamlit:
    build: .
    ports:
      - "8501:8501"  
    volumes:
      - .:/app  
      - ./chroma_db:/app/chroma_db 
      - ./data:/app/data 
    environment:
      - PYTHONPATH=/app
      - API_URL=http://api:8000
    command: ["streamlit", "run", "frontend/app.py", "--server.port=8501", "--server.address=0.0.0.0"]

  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./chroma_db:/app/chroma_db
      - ./data:/app/data
    environment:
      - PYTHONPATH=/app
    command: ["uvicorn", "src.api.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]